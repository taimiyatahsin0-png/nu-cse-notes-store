site_name: NU CSE – First Semester
site_description: First Semester CSE Notes, Programming Practice and Exam Preparation for National University Students
site_url: https://taimiyatahsin0-png.github.io/nu-cse-notes-store/

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Academic Syllabus:
      - Syllabus Overview: syllabus/index.md
  - Student Tools:
      - CGPA Calculator: tools/cgpa-calculator.md
      - Grade Scale: tools/grade-scale.md
      - Programming Hub: tools/programming-hub.md
      - PYQ Library: tools/pyq-library.md
  - First Semester:
      - SPL (510201): subjects/spl/index.md
      - SPL Lab (510202): subjects/spl-lab/index.md
      - EEC (510203): subjects/eec/index.md
      - EEC Lab (510204): subjects/eec-lab/index.md
      - Calculus (510205): subjects/cal/index.md
      - Physics (510207): subjects/phy/index.md
      - English (510209): subjects/eng/index.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name: material.extensions.emoji.twemoji
      emoji_generator: !!python/name: material.extensions.emoji.to_svg
  
extra_javascript:
  - javascripts/cgpa-calculator.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

